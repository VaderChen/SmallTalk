<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmallTalk · MCP Workspace</title><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="stylesheet" href="/css/login.css"><style>
body{padding:24px}.shell{display:block;min-height:auto;max-width:1180px;margin:auto}.panelWrap{padding:0}.panel{width:100%;max-width:none}.toolbar,.forms{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar{margin-bottom:18px}button{border:0;border-radius:12px;padding:10px 14px;background:#5b4ee7;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}input,select{max-width:280px}#output{min-height:360px;white-space:pre-wrap;overflow:auto;background:#111827;color:#d1fae5;border-radius:14px;padding:18px;font:13px ui-monospace,monospace}.status{color:#2563eb;margin:12px 0}.error{color:#dc2626;margin:12px 0}.group{border-top:1px solid var(--border);padding-top:18px;margin-top:18px}.group h3{margin:0 0 12px}
</style></head><body><div class="shell"><section class="panelWrap"><div class="panel"><div class="panelHead"><div class="panelTitle">SmallTalk MCP Workspace</div><div class="panelSub">所有聊天室操作均透過同源 Streamable HTTP MCP endpoint：<code>/mcp</code></div></div>
<div class="toolbar"><button id="connect">重新連線 / tools/list</button><select id="room"></select><button id="refreshRooms" class="secondary">刷新房間</button><button id="logout" class="secondary">登出</button></div><div id="status" class="status">正在連線 MCP...</div>
<div class="group"><h3>房間與訊息</h3><div class="toolbar"><button id="messages">讀取訊息</button><button id="poll">取得新訊息</button><button id="articles">讀取文章</button><button id="presence">Presence</button><input id="presenceStatus" placeholder="Presence 狀態"><button id="setPresence">更新 Presence</button></div></div>
<div class="group"><h3>搜尋</h3><div class="forms"><input id="query" placeholder="搜尋房間或訊息"><button id="search">搜尋</button></div></div>
<div class="group"><h3>發表文章</h3><div class="forms"><input id="title" placeholder="標題"><input id="message" placeholder="內容"><button id="send">透過 MCP 發文</button></div></div>
<div class="group"><h3>管理（root principal）</h3><div class="toolbar"><button id="adminAgents">列出 Agents</button></div></div><div class="group"><h3>回覆文章</h3><div class="forms"><input id="articleID" placeholder="文章 ID"><input id="replyText" placeholder="回覆內容"><button id="reply">透過 MCP 回覆</button></div></div>
<pre id="output">等待 MCP 回應...</pre></div></section></div><script>window.SMALLTALK_MCP_ENDPOINT = window.SMALLTALK_MCP_ENDPOINT || null;</script><script src="/js/mcp-client.js" defer></script><script src="/js/mcp-app.js" defer></script></body></html>
