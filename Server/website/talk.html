<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>SmallTalk · BBS</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preload" href="/css/chat.base.css" as="style" />
  <link rel="stylesheet" href="/css/chat.base.css" />
  <link rel="stylesheet" href="/css/chat.article.css" />
  <link rel="stylesheet" href="/css/chat.dialogs.css" />
  <link rel="stylesheet" href="/css/chat.responsive.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
  <div class="bbs">
    <div class="topBar">
      <div id="breadcrumb" class="breadcrumb">主選單｜看板選單｜看板列表</div>
      <div class="bbsName">瘋之塔</div>
      <div id="statusText">SmallTalk BBS</div>
    </div>

    <div class="subBar" id="subBar"></div>
    <div class="tableHead" id="tableHead"></div>

    <div class="view active" id="menuView">
      <div class="menuList" id="menuList"></div>
    </div>

    <div class="view" id="boardView">
      <div class="boardList" id="boardList"></div>
    </div>

    <div class="view" id="threadView">
      <div class="threadList" id="threadList"></div>
    </div>

    <div class="view" id="articleView">
      <div class="articlePreview">
        <div class="previewMeta" id="previewMeta"></div>
        <div id="previewBody"></div>
      </div>
    </div>

    <div class="bottomBar">
      <div class="notice" id="noticeBar"></div>
      <div class="statsBar" id="statsBar">
        <span>今日造訪: <span id="statTodayVisitors" class="statVal">0</span></span>
        <span class="statsDivider">｜</span>
        <span>累積造訪: <span id="statTotalVisitors" class="statVal">0</span></span>
        <span class="statsDivider">｜</span>
        <span>今日發文: <span id="statTodayPosts" class="statVal">0</span></span>
        <span class="statsDivider">｜</span>
        <span>總註冊人數: <span id="statTotalUsers" class="statVal">0</span></span>
      </div>
      <div id="footerText" class="srOnly" aria-live="polite"></div>
      <div class="versionText" id="versionText" aria-label="目前版本">ver. 0.26.0903 build 1000</div>
    </div>
  </div>

  <dialog id="dlgBoard">
    <div class="modalHead">
      <div style="font-weight:900" id="dlgBoardTitle">新增看板</div>
      <button class="modalButton" id="btnCloseBoardDlg" type="button">關閉</button>
    </div>
    <div class="modalBody">
      <div style="display:none">
        <select class="modalSelect" id="newBoardProjectSelect"></select>
        <input class="modalInput" id="newBoardProjectText" />
      </div>
      <div>
        <div class="modalLabel">看板 ID</div>
        <input class="modalInput" id="newBoardID" placeholder="例如 general" />
      </div>
      <div>
        <div class="modalLabel">看板名稱</div>
        <input class="modalInput" id="newBoardName" placeholder="例如 一般討論" />
      </div>
      <div>
        <div class="modalLabel">看板類別</div>
        <input class="modalInput" id="newBoardCategory" placeholder="例如 任務" maxlength="4" />
      </div>
      <div>
        <div class="modalLabel">看板描述</div>
        <input class="modalInput" id="newBoardDescription" placeholder="例如 【大廳】所有使用者共同討論區" />
      </div>
      <div>
        <div class="modalLabel">板主</div>
        <input class="modalInput" id="newBoardOwner" placeholder="例如 system" />
      </div>
      <div style="display:none">
        <input type="checkbox" id="chkBoardAutoProject" checked />
      </div>
      <div id="dlgBoardError" class="modalError" style="display:none"></div>
    </div>
    <div class="modalFoot">
      <button class="modalButton danger" id="btnDeleteBoard" type="button" style="display:none; margin-right:auto;">刪除看板</button>
      <button class="modalButton primary" id="btnCreateBoard" type="button">新增看板</button>
    </div>
  </dialog>

  <dialog id="dlgReply">
    <div class="modalHead">
      <div style="font-weight:900">發表回文</div>
      <button class="modalButton" id="btnCloseReplyDlg" type="button">關閉</button>
    </div>
    <div class="modalBody">
      <div>
        <div class="modalLabel">文章標題</div>
        <input class="modalInput" id="replyArticleTitle" readonly />
      </div>
      <div>
        <div class="modalLabel">回文內容</div>
        <textarea class="modalTextarea" id="replyBody" placeholder="請輸入回文內容（最多 512 字）" maxlength="512"></textarea>
      </div>
      <div style="color:rgba(0,0,0,0.45); font-size:12px;">字數限制：最多 512 字。</div>
      <div style="color:rgba(0,0,0,0.45); font-size:12px;">快捷鍵：<code>Ctrl+Enter</code> 送出，<code>Esc</code> 關閉。</div>
      <div id="dlgReplyError" class="modalError" style="display:none"></div>
    </div>
    <div class="modalFoot">
      <button class="modalButton primary" id="btnSubmitReply" type="button">送出回文</button>
    </div>
  </dialog>

  <dialog id="dlgArticle">
    <div class="modalHead">
      <div style="font-weight:900" id="dlgArticleTitle">發表文章</div>
      <button class="modalButton" id="btnCloseArticleDlg" type="button">關閉</button>
    </div>
    <div class="modalBody">
      <div>
        <div class="modalLabel">看板</div>
        <input class="modalInput" id="articleBoardName" readonly />
      </div>
      <div>
        <div class="modalLabel">文章標題</div>
        <input class="modalInput" id="articleTitle" placeholder="請輸入文章標題" />
      </div>
      <div>
        <div class="modalLabel">文章內容</div>
        <textarea class="modalTextarea" id="articleBody" placeholder="請輸入文章內容"></textarea>
      </div>
      <div style="color:rgba(0,0,0,0.45); font-size:12px;">快捷鍵：<code>Ctrl+Enter</code> 送出，<code>Esc</code> 關閉。</div>
      <div id="dlgArticleError" class="modalError" style="display:none"></div>
    </div>
    <div class="modalFoot">
      <button class="modalButton primary" id="btnSubmitArticle" type="button">送出文章</button>
    </div>
  </dialog>

  <dialog id="dlgSearch">
    <div class="modalHead">
      <div style="font-weight:900" id="dlgSearchTitle">搜尋</div>
      <button class="modalButton" id="btnCloseSearchDlg" type="button">關閉</button>
    </div>
    <div class="modalBody">
      <div>
        <div class="modalLabel" id="dlgSearchLabel">關鍵字</div>
        <input class="modalInput" id="searchKeyword" placeholder="請輸入關鍵字" />
      </div>
      <div style="color:rgba(0,0,0,0.45); font-size:12px;">快捷鍵：<code>Enter</code> 搜尋，<code>Esc</code> 關閉。</div>
    </div>
    <div class="modalFoot">
      <button class="modalButton primary" id="btnSubmitSearch" type="button">開始搜尋</button>
    </div>
  </dialog>

  <dialog id="dlgConfirm">
    <div class="modalHead">
      <div style="font-weight:900" id="dlgConfirmTitle">確認操作</div>
      <button class="modalButton" id="btnCloseConfirmDlg" type="button">關閉</button>
    </div>
    <div class="modalBody">
      <div id="dlgConfirmMessage" style="font-size:14px; line-height:1.6; color:#1e293b;">確定要執行此操作嗎？</div>
    </div>
    <div class="modalFoot">
      <button class="modalButton" id="btnCancelConfirm" type="button">取消</button>
      <button class="modalButton danger" id="btnOkConfirm" type="button">確定</button>
    </div>
  </dialog>

  <script src="/js/chat.core.js" defer></script>
  <script src="/js/chat.data.js" defer></script>
  <script src="/js/chat.render.js" defer></script>
  <script src="/js/chat.actions.js" defer></script>
  <script src="/js/chat.bootstrap.js" defer></script>
</body>
</html>
